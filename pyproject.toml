[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
# B008: FastAPI uses `Depends(...)` in argument defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"Base/routers/__init__.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
